name: vela-relay

services:
  relay:
    image: ${VELA_RELAY_IMAGE:-vela-relay:local}
    build:
      context: .
      dockerfile: Dockerfile
    # `.env` is gitignored, so a fresh clone does not have one: marking it
    # optional keeps `docker compose build`/`config` working there. The relay
    # still needs it to run — see "Docker" in README.md (cp .env.example .env,
    # then fill it in).
    env_file:
      - path: .env
        required: false
    environment:
      VELA_RELAY_LISTEN_ADDR: 0.0.0.0:4567
    ports:
      - "${VELA_RELAY_PORT:-4567}:4567"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4567/readyz"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
